name = "letsplay-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[triggers]
crons = ["*/5 * * * *", "17 * * * *"]

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[d1_databases]]
binding = "DB"
database_name = "letsplay-db"
database_id = "66a364d6-b00a-42df-b1b4-004e284dd686"
remote = true

# R2 Storage
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "letmetellu-media"
remote = true

[vars]
ALLOWED_ORIGIN = "https://yapndot.com,https://www.yapndot.com,https://letmetellu.vercel.app,http://localhost:3000"
REPORTS_CHANNEL_ID = "reports"
# For development, temporarily use "*" if needed:
# ALLOWED_ORIGIN = "*"
