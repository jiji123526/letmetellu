name = "letsplay-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat", "enable_nodejs_http_modules"]

[triggers]
crons = ["* * * * *", "17 * * * *"]

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[d1_databases]]
binding = "DB"
database_name = "letsplay-db-prod-cutover-20260906-v3"
database_id = "bda67bc6-0b9f-4785-a63b-8e30c50b51a7"
remote = true

# R2 Storage
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "letmetellu-media"
remote = true

[vars]
ALLOWED_ORIGIN = "https://yapndot.com,https://www.yapndot.com,https://letmetellu.vercel.app,http://localhost:3000"
REPORTS_CHANNEL_ID = "reports"
# For development, temporarily use "*" if needed:
# ALLOWED_ORIGIN = "*"
